# SQL Server 2022 for local development. The API creates the Fathom database,
# applies migrations and seeds demo data on first start.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fathom!Dev2026"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - fathom-mssql:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "Fathom!Dev2026" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  fathom-mssql:
